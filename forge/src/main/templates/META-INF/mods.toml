modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Void-Seeker/OpenComputers-Modernized/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/Void-Seeker/OpenComputers-Modernized"
logoFile = "assets/opencomputers/textures/gui/logo.png"
credits = "Inspired by a couple of other mods, most notably ComputerCraft."
authors = "Florian 'Sangar' Nuecke, Johannes 'Lord Joda' Lohrer, habzg, Everyone who contributed to the mod on Github - thank you!"
description = '''
This mod adds modular computers and robots that can be programmed in Lua.
'''

